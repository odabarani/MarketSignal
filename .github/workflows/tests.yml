name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: python -m pytest -q

      - name: Check Gunicorn readiness and Dash endpoints
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          import time
          from urllib.request import urlopen
          from scripts.smoke import smoke

          with tempfile.TemporaryDirectory() as directory:
              process = subprocess.Popen(
                  ['gunicorn', 'app:server', '--bind', '127.0.0.1:9054', '--workers', '1'],
                  env=dict(os.environ, MARKETSIGNAL_DATA_DIR=directory),
              )
              try:
                  deadline = time.monotonic() + 20
                  while True:
                      try:
                          with urlopen('http://127.0.0.1:9054/health', timeout=2) as response:
                              assert response.status == 200
                          break
                      except OSError:
                          if time.monotonic() >= deadline or process.poll() is not None:
                              raise
                          time.sleep(.1)
                  smoke('http://127.0.0.1:9054')
              finally:
                  process.terminate()
                  process.wait(timeout=10)
          PY
