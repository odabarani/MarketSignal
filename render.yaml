services:
  - type: web
    name: marketsignal
    runtime: python
    # Persistent disks require a paid instance. Review provider pricing before deployment.
    # Leave memory headroom for the web process and isolated model worker.
    plan: standard
    disk:
      name: marketsignal-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /ready
    envVars:
      - key: MARKETSIGNAL_DATA_DIR
        value: /var/data/marketsignal
      - key: OMP_NUM_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "2"
      - key: PYTHON_VERSION
        value: 3.11.16
